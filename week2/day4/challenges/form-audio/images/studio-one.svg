    <rect x="79" y="243" width="46" height="70" rx="23" fill="#a53a19"/>
    <rect x="275" y="243" width="46" height="70" rx="23" fill="#a53a19"/>

    <rect x="88" y="252" width="28" height="52" rx="14" fill="#f39a72" opacity="0.6"/>
