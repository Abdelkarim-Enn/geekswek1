<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
    <title id="title">Studio One headphones</title>
    <desc id="desc">Orange over-ear headphones with a dark headband on a soft cream circle.</desc>

    <defs>
        <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ef6d3d"/>
            <stop offset="1" stop-color="#cf4820"/>
        </linearGradient>
    </defs>

    <circle cx="200" cy="200" r="168" fill="#f4efe8"/>
    <ellipse cx="200" cy="318" rx="112" ry="12" fill="#d9cec0" opacity="0.7"/>

