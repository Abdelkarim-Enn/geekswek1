<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Legends | Player Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="home">
        <div class="header-top">
            <h1>Football Legends</h1>
            <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
                Dark Mode
            </button>
        </div>

        <p>Discover the greatest football players</p>

        <nav>
            <a href="#home">Home</a>
            <a href="#players">Players</a>
        </nav>

        <input
            type="search"
            id="search-input"
            placeholder="Search for a player..."
            aria-label="Search for a player"
        >
    </header>

    <main>
        <section id="players">
            <h2>Our Players</h2>

            <section class="controls" aria-label="Filter and sort players">
                <div class="control-group">
                    <label for="category-filter">Filter by position:</label>
                    <select id="category-filter">
                        <option value="All">All Players</option>
                        <option value="Forward">Forward</option>
                        <option value="Defender">Defender</option>
                        <option value="Midfielder">Midfielder</option>
                        <option value="Goalkeeper">Goalkeeper</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="sort-select">Sort by:</label>
                    <select id="sort-select">
                        <option value="default">Default order</option>
                        <option value="name-asc">Name A-Z</option>
                        <option value="name-desc">Name Z-A</option>
                        <option value="rating-desc">Highest rating first</option>
                    </select>
                </div>

                <label class="favorites-filter" for="favorites-filter">
                    <input type="checkbox" id="favorites-filter">
                    Favorites only
                </label>

                <button type="button" id="toggle-form-btn" class="primary-btn">
                    Add Player
                </button>
            </section>

            <section id="add-player-section" class="add-player-section" hidden>
                <h2>Add a New Player</h2>

                <form id="add-player-form" novalidate>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="player-name">Player name *</label>
                            <input type="text" id="player-name" name="name" required>
                        </div>

                        <div class="form-field">
                            <label for="player-category">Category *</label>
                            <select id="player-category" name="category" required>
                                <option value="">Select a category</option>
                                <option value="Forward">Forward</option>
                                <option value="Defender">Defender</option>
                                <option value="Midfielder">Midfielder</option>
                                <option value="Goalkeeper">Goalkeeper</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="player-club">Club *</label>
                            <input type="text" id="player-club" name="club" required>
                        </div>

                        <div class="form-field">
                            <label for="player-image">Image URL</label>
                            <input type="url" id="player-image" name="image" placeholder="https://example.com/player.jpg">
                        </div>

                        <div class="form-field">
                            <label for="player-rating">Rating (0 - 10) *</label>
                            <input type="number" id="player-rating" name="rating" min="0" max="10" step="0.1" required>
                        </div>

                        <div class="form-field">
                            <label for="player-nationality">Nationality *</label>
                            <input type="text" id="player-nationality" name="nationality" required>
                        </div>

                        <div class="form-field">
                            <label for="player-position">Position *</label>
                            <input type="text" id="player-position" name="position" required>
                        </div>

                        <div class="form-field full-width">
                            <label for="player-description">Short description *</label>
                            <textarea id="player-description" name="description" required></textarea>
                        </div>

                        <div class="form-field full-width">
                            <label for="player-achievements">Achievements *</label>
                            <textarea id="player-achievements" name="achievements" required></textarea>
                        </div>
                    </div>

                    <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

                    <div class="form-actions">
                        <button type="submit" class="primary-btn">Add Player</button>
                        <button type="button" id="cancel-form-btn" class="secondary-btn">Cancel</button>
                    </div>
                </form>
            </section>

            <div class="player" id="cards-grid"></div>

            <p id="empty-state" hidden>
                No players found. Try another search.
            </p>
        </section>
    </main>

    <dialog id="player-modal" aria-labelledby="modal-player-name">
        <div class="modal-content">
            <button type="button" id="modal-close" class="modal-close" aria-label="Close player details">
                X
            </button>

            <div class="modal-body">
                <img id="modal-image" class="modal-image" src="" alt="">

                <div class="modal-details">
                    <h2 id="modal-player-name"></h2>
                    <p id="modal-category" class="modal-category"></p>

                    <p><strong>Rating:</strong> <span id="modal-rating"></span></p>
                    <p><strong>Nationality:</strong> <span id="modal-nationality"></span></p>
                    <p><strong>Club:</strong> <span id="modal-club"></span></p>
                    <p><strong>Position:</strong> <span id="modal-position"></span></p>

                    <p id="modal-description" class="modal-description"></p>

                    <h3>Achievements</h3>
                    <p id="modal-achievements"></p>
                </div>
            </div>
        </div>
    </dialog>

    <script src="data.js" defer></script>
    <script src="script.js" defer></script>

</body>
</html>
